# Builds the Windows installer and attaches it to a draft GitHub release.
# Start it by pushing a version tag, for example:  git tag v0.1.0 && git push origin v0.1.0
# The release stays a draft until you publish it on GitHub.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Gino ${{ github.ref_name }}
          releaseBody: |
            Download **Gino_…_x64-setup.exe** below and run it. Windows 10 or 11, 64-bit.
            Windows may warn that the installer is from an unknown publisher: choose *More info*, then *Run anyway*.
          releaseDraft: true
          prerelease: false
