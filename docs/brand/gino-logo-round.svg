<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 1520 560" width="740" height="260">
  <title>Gino — rounded hand-drawn logotype (concept B)</title>
  <defs>
    <!-- A slight wobble, so the strokes read as drawn with a marker, not set. -->
    <filter id="hand" filterUnits="userSpaceOnUse" x="-200" y="-200" width="2000" height="1000">
      <feTurbulence type="fractalNoise" baseFrequency="0.004" numOctaves="1" seed="5" result="wobble" />
      <feDisplacementMap in="SourceGraphic" in2="wobble" scale="12" xChannelSelector="R" yChannelSelector="G" result="drawn" />
      <feGaussianBlur in="drawn" stdDeviation="2.2" result="soft" />
      <feColorMatrix in="soft" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.45  0 0 0 0 0.45  0 0 0 1 0" result="rim" />
      <feMerge><feMergeNode in="rim" /><feMergeNode in="drawn" /></feMerge>
    </filter>
  </defs>
  <rect x="-20" y="-20" width="1520" height="560" fill="#ffffff" />
  <g filter="url(#hand)" fill="none" stroke="#111" stroke-width="104" stroke-linecap="round" stroke-linejoin="round">
    <!-- G: open at the top right, the stem rising from the bottom of the bowl. -->
    <path d="M 238 104 C 160 98, 84 150, 66 250 C 50 350, 110 412, 200 414 C 262 415, 284 382, 284 334 L 282 252" />
    <!-- I -->
    <path d="M 478 112 L 474 398" />
    <!-- N: the lowercase-shaped n of the drawing, with its notch at the top of the stem. -->
    <path d="M 672 108 L 668 402" />
    <path d="M 690 168 C 720 136, 752 122, 784 126 C 826 132, 846 192, 862 248 C 876 296, 886 350, 894 402" />
    <!-- O -->
    <ellipse cx="1206" cy="262" rx="160" ry="156" />
  </g>
</svg>
