[workspace]
resolver = "2"
members = ["crates/ginos-core", "crates/ginos-cli", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
publish = false

[workspace.dependencies]
parley = "=0.13.0"
fontique = "=0.13.0"
krilla = "=0.8.2"
hayro = "=0.9.0"
resvg = "=0.50.0"
usvg = "=0.50.0"
tiny-skia = "=0.12.0"
kurbo = "=0.13.1"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "tiff"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
clap = { version = "=4.6.7", features = ["derive"] }
tauri = "=2.12.5"
tauri-build = "=2.7.4"
tauri-plugin-dialog = "=2.8.4"
thiserror = "=2.0.21"
base64 = "=0.22.1"
skrifa = { version = "=0.49.0", default-features = false, features = ["std"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
